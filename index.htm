<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="stylesheet" href="style.css" >
</head>
<body>



      <!-- Шапка сайта -->
      <header class="header">
        <div class="header-container">
          <a href="#" class="logo">Wishbone+Partners</a>

          <nav class="nav">
            <a href="#" class="nav-link">Projects</a>
            <a href="#" class="nav-link">About</a>
            <a href="#" class="nav-link">News</a>
            <a href="#" class="nav-link">Team</a>
            <a href="#" class="nav-link">Contact</a>
          </nav>

          <a href="#" class="btn-template">Get template</a>
        </div>
      </header>

      <!-- Первый экран (Hero-секция) -->
      <section class="hero">
        <!-- Левый блок с текстом -->
        <div class="hero-content">
          <span class="hero-subtitle">WISHBONE+PARTNERS</span>
          <h1 class="hero-title">The home of beautiful architecture.</h1>
          <p class="hero-description">
            Будет дом как у известного рэпера.
			  Помните такого
          </p>
          <a href="#" class="hero-link">Read more</a>
        </div>

        <!-- Правый блок с изображением -->
        <div class="hero-image">
          <img src="r.jpeg" alt="Architecture">
        </div>
      </section>
      <section class="about-firm">
          <div class="about-container">

            <!-- Левая колонка с заголовком -->
            <div class="about-title-col">
              <h2>Our firm</h2>
            </div>

            <!-- Правая колонка с текстом и автором -->
            <div class="about-content-col">
              <p>
                Рисуешь?
              </p>

              <p>
                Что? Рисую ли ... Ну ну да да я рисую!
              </p>

              <p>
                Сколько в день ?
              </p>

              <!-- Блок с аватаром и именем автора -->
              <div class="author-card">
                <img src="danya.jpg" alt="Stephen Collier" class="author-avatar">
                <div class="author-info">
                  <span class="author-name">Stephen Collier</span>
                  <span class="author-role">Senior Partner</span>
                </div>
              </div>
            </div>

          </div>
        </section>

    </body>
    </html>
